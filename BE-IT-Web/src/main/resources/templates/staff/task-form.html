<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${task.taskId != null ? 'Chỉnh sửa Công việc' : 'Tạo Công việc mới'}">Form Task</title>
    <link rel="stylesheet" th:href="@{/common-styles.css}">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="form-container">
        <div class="form-header">
            <h1 th:text="${task.taskId != null ? 'Chỉnh sửa Công việc' : 'Tạo Công việc mới'}">Form Task</h1>
            <p>Điền thông tin chi tiết công việc</p>
        </div>

        <div class="form-content">
            <form th:action="${task.taskId != null ? '/staff/tasks/update/' + task.taskId : '/staff/tasks/save'}"
                  method="post"
                  th:object="${task}">

                <div class="form-group">
                    <label for="title">
                        Tên công việc <span class="required">*</span>
                    </label>
                    <input type="text"
                           id="title"
                           name="title"
                           th:field="*{title}"
                           placeholder="Ví dụ: Thiết kế giao diện trang chủ"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">
                        Mô tả <span class="required">*</span>
                    </label>
                    <textarea id="description"
                              name="description"
                              th:field="*{description}"
                              placeholder="Nhập mô tả chi tiết về công việc..."
                              required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="roomId">
                            Phòng <span class="required">*</span>
                        </label>
                        <select id="roomId" name="roomId" required>
                            <option value="">-- Chọn phòng --</option>
                            <option th:each="room : ${rooms}"
                                    th:value="${room.roomId}"
                                    th:text="${room.roomName}"
                                    th:selected="${task.room != null && task.room.roomId == room.roomId}">
                                Room Name
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="assigneeId">
                            Người thực hiện
                        </label>
                        <select id="assigneeId" name="assigneeId">
                            <option value="">-- Chưa phân công --</option>
                            <option th:each="member : ${members}"
                                    th:value="${member.userId}"
                                    th:text="${member.fullName}"
                                    th:selected="${task.assignee != null && task.assignee.userId == member.userId}">
                                Member Name
                            </option>
                        </select>
                        <div class="hint">Có thể để trống và phân công sau</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="status">
                            Trạng thái <span class="required">*</span>
                        </label>
                        <select id="status" name="status" th:field="*{status}" required>
                            <option value="OPEN">Mới</option>
                            <option value="IN_PROGRESS">Đang thực hiện</option>
                            <option value="COMPLETED">Hoàn thành</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="progressPercent">
                            Tiến độ (%) <span class="required">*</span>
                        </label>
                        <input type="number"
                               id="progressPercent"
                               name="progressPercent"
                               th:field="*{progressPercent}"
                               min="0"
                               max="100"
                               placeholder="0-100"
                               required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="dueDate">
                        Hạn chót <span class="required">*</span>
                    </label>
                    <input type="date"
                           id="dueDate"
                           name="dueDate"
                           th:value="${task.dueDate != null ? #dates.format(task.dueDate, 'yyyy-MM-dd') : ''}"
                           required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">
                        <span th:text="${task.taskId != null ? 'Cập nhật' : 'Tạo mới'}">Lưu</span>
                    </button>
                    <a th:href="@{/staff/tasks}" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
