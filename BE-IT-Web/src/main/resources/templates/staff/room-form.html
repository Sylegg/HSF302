<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${room.roomId != null ? 'Chỉnh sửa Phòng' : 'Tạo Phòng mới'}">Form Phòng</title>
    <link rel="stylesheet" th:href="@{/common-styles.css}">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="form-container">
        <div class="form-header">
            <h1 th:text="${room.roomId != null ? 'Chỉnh sửa Phòng' : 'Tạo Phòng mới'}">Form Phòng</h1>
            <p>Điền thông tin phòng ban</p>
        </div>

        <div class="form-content">
            <form th:action="${room.roomId != null ? '/staff/rooms/update/' + room.roomId : '/staff/rooms/save'}"
                  method="post"
                  th:object="${room}">

                <div class="form-group">
                    <label for="roomName">
                        Tên phòng <span class="required">*</span>
                    </label>
                    <input type="text"
                           id="roomName"
                           name="roomName"
                           th:field="*{roomName}"
                           placeholder="Ví dụ: Phòng Phát triển Phần mềm"
                           required>
                </div>

                <div class="form-group">
                    <label for="description">
                        Mô tả <span class="required">*</span>
                    </label>
                    <textarea id="description"
                              name="description"
                              th:field="*{description}"
                              placeholder="Nhập mô tả chi tiết về phòng ban..."
                              required></textarea>
                </div>

                <div class="form-actions">
                    <a th:href="@{/staff/rooms}" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn">
                        <span th:text="${room.roomId != null ? 'Cập nhật' : 'Tạo mới'}">Lưu</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
