<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập nhật tiến độ công việc</title>
    <link rel="stylesheet" th:href="@{/common-styles.css}">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="form-container">
        <div class="form-header">
            <h1>Cập nhật tiến độ</h1>
            <div class="task-info">
                <h3 th:text="${task.title}">Task Name</h3>
                <p th:text="${task.description}">Task description</p>
            </div>
        </div>

        <div class="form-content">
            <div class="current-status">
                <h3>Trạng thái hiện tại</h3>
                <div class="status-grid">
                    <div class="status-item">
                        <span class="label">Trạng thái</span>
                        <span class="value" th:text="${task.status == 'OPEN' ? 'Mới' : (task.status == 'IN_PROGRESS' ? 'Đang làm' : 'Hoàn thành')}">Status</span>
                    </div>
                    <div class="status-item">
                        <span class="label">Tiến độ</span>
                        <span class="value" th:text="${task.progressPercent} + '%'">0%</span>
                    </div>
                    <div class="status-item">
                        <span class="label">Phòng</span>
                        <span class="value" th:text="${task.room != null ? task.room.roomName : 'N/A'}">Room</span>
                    </div>
                    <div class="status-item">
                        <span class="label">Hạn chót</span>
                        <span class="value" th:text="${#dates.format(task.dueDate, 'dd/MM/yyyy')}">Date</span>
                    </div>
                </div>
            </div>

            <form th:action="@{/member/tasks/update-progress/{id}(id=${task.taskId})}" method="post">

                <div class="form-group">
                    <label for="status">
                        Trạng thái <span class="required">*</span>
                    </label>
                    <select id="status" name="status" required>
                        <option value="OPEN" th:selected="${task.status == 'OPEN'}">Mới</option>
                        <option value="IN_PROGRESS" th:selected="${task.status == 'IN_PROGRESS'}">Đang thực hiện</option>
                        <option value="COMPLETED" th:selected="${task.status == 'COMPLETED'}">Hoàn thành</option>
                    </select>
                    <div class="hint">Cập nhật trạng thái công việc hiện tại của bạn</div>
                </div>

                <div class="form-group">
                    <label for="progressPercent">
                        Tiến độ hoàn thành (%) <span class="required">*</span>
                    </label>
                    <input type="range"
                           id="progressPercent"
                           name="progressPercent"
                           min="0"
                           max="100"
                           th:value="${task.progressPercent}"
                           oninput="updateProgressPreview(this.value)"
                           required>

                    <div style="margin-top: 15px;">
                        <div class="progress-bar full-width">
                            <div class="progress-fill" id="progressFill" th:style="'width: ' + ${task.progressPercent} + '%'">
                                <span id="progressText" th:text="${task.progressPercent} + '%'">0%</span>
                            </div>
                        </div>
                    </div>
                    <div class="hint">Kéo thanh trượt để cập nhật % hoàn thành công việc (0-100)</div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">Cập nhật tiến độ</button>
                    <a th:href="@{/member/tasks}" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function updateProgressPreview(value) {
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            progressFill.style.width = value + '%';
            progressText.textContent = value + '%';
        }
    </script>
</body>
</html>
